<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finko Intelligence</title>
<style>
  :root {
    --bg: #faf9f6;
    --ink: #1c1f1a;
    --muted: #6b6f64;
    --accent: #33473b;
    --rule: #dedad2;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vw 6vw;
  }

  main {
    max-width: 620px;
    width: 100%;
  }

  h1 {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(2.4rem, 6vw, 3.4rem);
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--accent);
  }

  p.lead {
    margin-top: 1.4rem;
    font-size: clamp(1.05rem, 2vw, 1.2rem);
    line-height: 1.55;
    color: var(--ink);
    max-width: 34em;
  }

  hr {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 2.2rem 0;
    width: 3rem;
  }

  p.status {
    font-size: 0.95rem;
    color: var(--muted);
  }

  @media (max-width: 480px) {
    body { padding: 10vw 7vw; }
  }
</style>
</head>
<body>
  <main>
    <h1>Finko Intelligence</h1>
    <p class="lead">Sistema inteligente para analizar el rendimiento de propiedades publicadas en Instagram.</p>
    <hr>
    <p class="status">Prueba inicial del frontend.</p>
  </main>
</body>
</html>
