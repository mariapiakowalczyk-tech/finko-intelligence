<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Finko Intelligence</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #faf9f6;
      color: #1c1f1a;
      padding: 60px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .subtitulo {
      font-size: 20px;
      margin-bottom: 40px;
    }

    .propiedad {
      margin-top: 20px;
      padding: 20px;
      border: 1px solid #dedad2;
      border-radius: 10px;
      max-width: 500px;
      background: white;
    }

    .estado {
      color: #555;
    }

    #mensaje {
      margin-top: 20px;
    }
  </style>

</head>

<body>

  <h1>Finko Intelligence</h1>

  <p class="subtitulo">
    Sistema inteligente para analizar el rendimiento de propiedades publicadas en Instagram.
  </p>

  <h2>Propiedades guardadas en Supabase</h2>

  <div id="mensaje">Cargando...</div>

  <div id="propiedades"></div>


  <script type="module">

    import { createClient }
    from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const SUPABASE_URL =
      "https://acugsylkebfyxnunbacn.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable__931Y3PHR3tN1YkHMSPZGQ_bgX4AE7s";


    const clienteSupabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    async function cargarPropiedades() {

      const mensaje =
        document.getElementById("mensaje");

      const contenedor =
        document.getElementById("propiedades");


      try {

        const { data, error } =
          await clienteSupabase
            .from("propiedades")
            .select("id, nombre, estado")
            .order("id", { ascending: true });


        if (error) {
          throw error;
        }


        mensaje.textContent = "";


        if (data.length === 0) {

          mensaje.textContent =
            "No hay propiedades cargadas.";

          return;
        }


        data.forEach(propiedad => {

          const tarjeta =
            document.createElement("div");

          tarjeta.className =
            "propiedad";


          tarjeta.innerHTML = `
            <h3>${propiedad.nombre}</h3>
            <p class="estado">
              Estado: ${propiedad.estado}
            </p>
          `;


          contenedor.appendChild(tarjeta);

        });


      } catch (error) {

        mensaje.textContent =
          "Error al cargar propiedades.";

        console.error(
          "Error al conectar con Supabase:",
          error
        );

      }

    }


    cargarPropiedades();

  </script>

</body>

</html>
